<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Fashion Wear | Premium Apparel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #fafafa; color: #111; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        header { background: #ffffff; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: #000; }
        nav a { margin-left: 25px; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: #555; }
        .hero { background: #111111; height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #ffffff; padding: 20px; }
        .hero h2 { font-size: 48px; font-weight: 700; text-transform: uppercase; letter-spacing: 6px; margin-bottom: 15px; }
        .hero p { font-size: 18px; font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; }
        .btn { background: #fff; color: #000; padding: 12px 35px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border: none; cursor: pointer; }
        .section-title { text-align: center; margin: 60px 0 30px 0; font-size: 28px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; }
        .products-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; padding: 0 20px 80px 20px; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 4px; overflow: hidden; text-align: center; }
        .product-img { width: 100%; height: 380px; object-fit: cover; background-color: #eaeaea; }
        .product-info { padding: 20px; }
        .product-brand { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .product-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .product-price { font-size: 15px; font-weight: 500; color: #111; margin-bottom: 15px; }
        footer { background: #111; color: #fff; text-align: center; padding: 40px 20px; font-size: 13px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">Phoenix</div>
            <nav><a href="#">Home</a><a href="#collection">Collection</a></nav>
        </div>
    </header>
<section class="hero">
    <!-- DIRECT HTML PHOENIX BIRD LOGO -->
    <svg xmlns="http://w3.org" viewBox="0 0 24 24" style="width: 100px; height: 100px; fill: #ffffff; margin-bottom: 20px;">
        <path d="M12 2s.5 2.5 1.5 4.5S15.5 10 17 11c-1.5-.5-3-1.5-4-3.5C12 9.5 11 11 9.5 12c1.5 0 2.5-1.5 3-3.5C11.5 9 10 8 9.5 6.5 10 8.5 11 10 12 11c-.5-1.5-1-3.5 0-9zm0 4c1.5 2 3.5 3.5 6 4-2.5-.5-4.5-2-5.5-4zm-6 5c2.5-.5 4.5-2 5.5-4-1.5 2-3.5 3.5-6 4zm6 2c-3.31 0-6 2.69-6 6h12c0-3.31-2.69-6-6-6z"/>
    </svg>

    <h2>Phoenix Fashion Wear</h2>
    <p>Rise in Style. Redefine Your Wardrobe.</p>
</section>

    <section id="collection">
        <h3 class="section-title">New Arrivals</h3>
        <div class="products-grid">
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="SHIRT">
                <div class="product-info">
                    <div class="product-brand">Phoenix Outerwear</div>
                    <div class="product-name">Classic Tailored Trench</div>
                    <div class="product-price">699.00</div>
                </div>
            </div>
            <div class="product-card">
                <img class="product-img" src="https://unsplash.com" alt="T-SHIRTS">
                <div class="product-info">
                    <div class="product-brand">Phoenix Essentials</div>
                    <div class="product-name">HALF OVERSIZED T SHIRTS</div>
                    <div class="product-price">499.00</div>
                </div>
            </div>
        </div>
    </section>
    <footer><p>&copy; 2026 Phoenix Fashion Wear. All Rights Reserved.</p></footer>
</body>
</html>
